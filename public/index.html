<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Memory Admin</title>
<script>
  document.documentElement.dataset.theme =
    localStorage.getItem('theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧠</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar" data-ui="sidebar">
    <header data-ui="sidebarHead">
      <button id="collapse" data-ui="iconButton" title="Hide the project list" aria-label="Hide the project list">&#9668;</button>
      <h1 data-ui="sidebarTitle">memory<span data-ui="promptCaret">/</span>admin</h1>
      <p id="root-path" data-ui="sidebarRoot"></p>
      <input id="search" type="search" data-ui="searchInput" placeholder="Search all memories  ( / )" autocomplete="off" spellcheck="false">
      <label data-ui="toggleLabel">
        <input type="checkbox" id="show-all" data-ui="checkbox"> show projects without memory
      </label>
    </header>
    <nav id="project-list" data-ui="sidebarList" aria-label="Projects"></nav>
    <footer data-ui="sidebarFoot">
      <div data-ui="sidebarFootRow">
        <a href="https://bitspire.ch/" target="_blank" rel="noopener noreferrer" data-ui="sidebarCredit">
          <span>Brought to you by</span>
          <img src="/assets/bitspire-logo.webp" alt="BitSpire" width="96" data-ui="sidebarLogo">
        </a>
        <button id="theme-toggle" data-ui="themeToggle" title="Switch to the dark theme  ( t )" aria-label="Switch to the dark theme" aria-pressed="false">&#9790;</button>
      </div>
    </footer>
  </aside>

  <button id="expand" data-ui="expandHandle" title="Show the project list" aria-label="Show the project list" hidden>&#9658;</button>

  <main id="main" data-ui="main">
    <div id="empty-state" data-ui="emptyState">
      <h2 data-ui="emptyTitle">Pick a project</h2>
      <p>Each project keeps its memories in <code data-ui="inlineCode">~/.claude/projects/&lt;slug&gt;/memory/</code>, indexed by <code data-ui="inlineCode">MEMORY.md</code>.</p>
    </div>

    <div id="search-view" hidden>
      <header id="search-head" data-ui="searchHead">
        <h2 id="search-title" data-ui="searchTitle"></h2>
        <button id="search-clear" data-ui="buttonSmall">Clear</button>
      </header>
      <section id="search-results" data-ui="searchResults"></section>
    </div>

    <div id="project-view" hidden>
      <header id="project-head" data-ui="projectHead">
        <div data-ui="projectHeadRow">
          <h2 id="project-title" data-ui="projectTitle"></h2>
          <button id="delete-project" data-ui="buttonDangerSmall">Delete all memory</button>
        </div>
        <p id="project-sub" data-ui="projectSub"></p>
        <div id="tabs" data-ui="tabBar" role="tablist"></div>
      </header>
      <section id="tab-content" data-ui="tabContent"></section>
    </div>
  </main>
</div>

<div id="dialog-root"></div>
<div id="toast-root" data-ui="toastRoot" aria-live="polite"></div>

<script type="module" src="/app.mjs"></script>
</body>
</html>
